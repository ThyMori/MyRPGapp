# Publication automatique sur GitHub Pages à chaque push sur main.
# Réglage à faire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main] # se déclenche à chaque push sur main
  workflow_dispatch: {} # permet aussi de le lancer à la main depuis l'onglet Actions

# Droits minimaux nécessaires pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois : le plus récent remplace l'ancien.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # récupère le code
      - uses: actions/setup-node@v4 # installe Node
        with:
          node-version: 22
          cache: npm
      - run: npm ci # installe les dépendances exactement comme dans package-lock.json
      - run: node scripts/bump-version.mjs --check # les quatre numéros de version doivent être d'accord
      - run: npm test # les tests passent avant le build
      - run: npm run build # contrôle des types puis construction du site dans dist/
      - uses: actions/configure-pages@v5 # prépare la publication
      - uses: actions/upload-pages-artifact@v3 # envoie le dossier dist/
        with:
          path: dist

  deploy:
    needs: build # attend que le build réussisse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # publie le site
