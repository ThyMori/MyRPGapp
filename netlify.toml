# Netlify est MIS EN PAUSE (0.6.2) : le site est publié par GitHub Pages (.github/workflows/pages.yml).
# Cette commande « ignore » annule tout build Netlify (code de sortie 0 = ne pas construire), pour ne plus consommer de crédits
# tant que le site Netlify n'est pas supprimé ou déconnecté du dépôt. Pour reprendre Netlify : supprimer ce fichier et
# remettre l'ancien netlify.toml (voir l'historique git, version 0.6.1).
[build]
  ignore = "exit 0"
