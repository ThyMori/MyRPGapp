# Réglages de publication sur Netlify : lus automatiquement à chaque déploiement.
# Ainsi rien n'est à régler à la main dans l'interface, et tout est versionné avec le code.

[build]
  # Vérifie les numéros de version, lance les tests, puis contrôle les types et construit le site.
  # Si une étape échoue, rien n'est publié : la version précédente reste en ligne.
  command = "node scripts/bump-version.mjs --check && npm test && npm run build"
  # Dossier produit par Vite, envoyé tel quel sur le réseau de Netlify.
  publish = "dist"

[build.environment]
  # Version de Node utilisée pour construire : Vite 8 en demande une récente.
  NODE_VERSION = "22"
